[project]
name = "saas-identity-platform-fastapi"
version = "0.1.0"
description = "SaaS 多租户多应用身份平台"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    # JWT 签发（HS256，镜像 springboot JwtIssuer；REQ-2026-002 批1）
    "pyjwt==2.10.1",
    # 密码校验（bcrypt，家族 `plain:` 前缀约定的回退分支；REQ-2026-002 批1）
    "bcrypt==4.3.0",
    # ORM + PG 驱动：运行时依赖，必须随 Docker 镜像（镜像只装主依赖）。2026-10-02
    # prod 首航事故：sqlalchemy 此前只经 dev 组 sqlacodegen 传递带入，容器 import
    # app 即 ModuleNotFoundError；psycopg2 靠 Dockerfile build 补丁——一并归位主依赖。
    "sqlalchemy>=2.1",
    "psycopg2-binary>=2.9",
]

[project.optional-dependencies]
dev = [
    "pytest>=8",
    "httpx>=0.27",
    # ruff/mypy 故意不在依赖里 —— suite 钉版全局工具链（gate.py RUFF_PINNED_VERSION），
    # 项目装新版会在 venv 遮蔽钉版触发 [RUFF-PIN] exit 2（2026-09-29 实测）
    "sqlacodegen==4.0.4",
    # sqlalchemy/psycopg2 已升主依赖（2026-10-02 首航事故），dev 组不再重复声明
]

[tool.ruff]
line-length = 100
target-version = "py311"
# 生成区禁手改（gen-shared.sh / scaffold-entities.sh 产物），不进格式与 lint 门
extend-exclude = [
    "src/saas_identity_platform_fastapi/apis",
    "src/saas_identity_platform_fastapi/models",
    "src/saas_identity_platform_fastapi/security_api.py",
    "src/saas_identity_platform_fastapi/entities.py",
]

[tool.ruff.lint]
select = ["E", "F", "I", "N", "UP", "B", "SIM", "ARG", "PTH"]

[tool.mypy]
python_version = "3.11"
strict = true
# 生成区不作为检查入口（exclude 只影响直接检查目标）；被手写区 import 时
# 经下方 overrides 以 silent 模式接入 —— 生成区自身错误不上报，但类型签名
# 真实外露，impl 缝继承 Base*Api 走真类型而非 Any（不放宽 disallow_subclassing_any）
exclude = [
    "^src/saas_identity_platform_fastapi/apis/",
    "^src/saas_identity_platform_fastapi/models/",
    "^src/saas_identity_platform_fastapi/security_api\\.py$",
    "^src/saas_identity_platform_fastapi/entities\\.py$",
]

[[tool.mypy.overrides]]
module = [
    "saas_identity_platform_fastapi.apis.*",
    "saas_identity_platform_fastapi.models.*",
    "saas_identity_platform_fastapi.security_api",
    "saas_identity_platform_fastapi.entities",
]
follow_imports = "silent"

[[tool.mypy.overrides]]
module = "saas_identity_platform_fastapi.impl.*"
# 生成 Base*Api 类体的 __init_subclass__ 钩子（pkgutil 缝发现机制）未标注，
# 缝类继承语句必然触发 no-untyped-call；继承之外的手写代码保持全 strict
disallow_untyped_calls = false

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
