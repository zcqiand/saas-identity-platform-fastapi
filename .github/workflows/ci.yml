name: ci

# saas-identity-platform-fastapi (Python 3.11 + FastAPI + openapi-generator 7.24.0 产物)
# 家族原则（镜像 rails/springboot ci.yml 注释）：CI=静态三件 + 组合根装配冒烟；
# gate=全量（含 L4 真测试与 codegen 幂等 strict）。L4 首批测试落地后按需扩 CI。
# ruff==0.15.21 与 suite gate.py RUFF_PINNED_VERSION 同版钉定——升版必须双处同步。
# mypy==1.20.2（2026-10-02 CI 三连红修复）：1.8.0 不认识 sqlalchemy 2.1.x 源码内嵌
# disable-error-code="untyped-decorator"（该码 1.9 引入）——CI 一体环境拉到 2.1.1 即炸
# （全在 site-packages）；本地 anaconda 全局同版保持一致。升版先复现验证再双仓同步。
# codegen 产物不在 CI 重放（openapi-generator/sqlacodegen 本地跑，产物 committed；
# 幂等由 suite scripts/checks/check_codegen_idempotent.py --strict 收口）。
on:
  push:
    branches: [main, master]
    tags: ["v*"]
  pull_request:
    branches: [main, master]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: 安装依赖（runtime + dev；ruff/mypy 钉 suite 全局版本）
        run: |
          pip install -e ".[dev]"
          pip install ruff==0.15.21 mypy==1.20.2
      - name: L1 格式（ruff format --check）
        run: ruff format --check src tests
      - name: L2 静态检查（ruff check）
        run: ruff check src tests
      - name: L3 类型（mypy --strict）
        run: mypy --strict src
      - name: 组合根装配冒烟（生成 router 挂载 + impl 缝可达）
        # app 经 PEP 562 惰性构建：首次访问才读 env（fail-fast，禁代码兜底）——
        # CI 冒烟显式提供 dev 占位值（suite 硬规则 §1：显式 env，非代码默认值）
        env:
          DATABASE_URL: postgresql://placeholder:placeholder@localhost:5432/placeholder
          JWT_SIGNING_KEY: dev-smoke-signing-key-32-bytes-minimum!
          JWT_ISSUER: saas-identity-platform
          JWT_AUDIENCE: saas-identity-platform-clients
          JWT_TTL_SECONDS: "3600"
        run: python -c "from saas_identity_platform_fastapi.app import app; assert len(app.routes) > 0; print('ROUTES:', len(app.routes))"

  # 部署链（saas X07=5107；镜像 saas-identity-platform-rails deploy job，tag push 触发）:
  #   docker build & push（latest + tag 双份）→ VPS deploy 脚本拉镜像 + 渲染 nginx vhost
  #   + 起容器 + /health 探活。fastapi.env 首启由 deploy 脚本从 SSH 透传 secrets 自举。
  deploy:
    runs-on: ubuntu-latest
    needs: test
    if: startsWith(github.ref, 'refs/tags/')
    concurrency:
      group: deploy-${{ github.event.repository.name }}-${{ github.ref }}
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Build and push Docker image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            ${{ secrets.DOCKER_USERNAME }}/${{ github.event.repository.name }}:latest
            ${{ secrets.DOCKER_USERNAME }}/${{ github.event.repository.name }}:${{ github.ref_name }}

      - name: Pull image and restart container on VPS
        uses: appleboy/ssh-action@v1
        # appleboy/ssh-action@v1 的 ${{ secrets.* }} 不会自动进 SSH 远端 shell;
        # step env 注入 Actions env,with.envs 列出要转发的名字 (逗号分隔)。
        env:
          PG_HOST: ${{ secrets.PG_HOST }}
          PG_PASSWORD: ${{ secrets.PG_PASSWORD }}
          JWT_SIGNING_KEY: ${{ secrets.JWT_SIGNING_KEY }}
          NGINX_DOMAIN: ${{ vars.NGINX_DOMAIN }}
          NGINX_CERT_BASENAME: ${{ vars.NGINX_CERT_BASENAME }}
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          envs: PG_HOST,PG_PASSWORD,JWT_SIGNING_KEY,NGINX_DOMAIN,NGINX_CERT_BASENAME
          script: |
            # 自举: 首次部署无 /home/deploy/<repo>/ 时自动建 + 拉 deploy 脚本
            set -e
            REPO="${{ github.event.repository.name }}"
            DEPLOY_DIR="/home/deploy/$REPO"
            mkdir -p "$DEPLOY_DIR"
            cd "$DEPLOY_DIR"
            # 总是重拉最新 deploy 脚本（脚本 bug fix 立即生效）；nginx 模板由脚本自拉
            curl -fsSL "https://raw.githubusercontent.com/zcqiand/${REPO}/refs/heads/master/deploy/${REPO}.sh" -o "$REPO.sh"
            chmod +x "$REPO.sh"
            # 缺 fastapi.env 时, deploy 脚本从 SSH env 透传的 secrets 自举
            # (UMASK 077, chmod 600)。后续 deploy 不需要这些 env (env-file 已存在)。
            echo "→ env on remote: PG_PASSWORD_set=$([ -n \"${PG_PASSWORD:-}\" ] && echo yes || echo no)"
            if [ ! -f "fastapi.env" ] && [ -z "${PG_PASSWORD:-}" ]; then
              echo "ERROR: fastapi.env missing AND PG_PASSWORD secret not forwarded, deploy script will fail-fast" >&2
            fi
            sh "$REPO.sh" "${{ secrets.DOCKER_USERNAME }}" "${{ secrets.DOCKER_PASSWORD }}" "${{ github.ref_name }}"
